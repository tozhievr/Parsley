name: Parsley toolchain
description: Install build tools and require a supported Clang version
runs:
  using: composite
  steps:
    - name: Install CMake and Ninja
      shell: bash
      run: |
        python -m pip install 'ninja==1.13.0'
        python scripts/ci_install_cmake.py
    - name: Install LLVM 23 on Linux
      if: runner.os == 'Linux'
      shell: bash
      run: |
        set -euo pipefail
        curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key | gpg --dearmor | sudo tee /usr/share/keyrings/llvm.gpg >/dev/null
        echo 'deb [signed-by=/usr/share/keyrings/llvm.gpg] https://apt.llvm.org/noble/ llvm-toolchain-noble-23 main' | sudo tee /etc/apt/sources.list.d/llvm23.list
        sudo apt-get update
        sudo apt-get install -y clang-23 lld-23 libclang-rt-23-dev
        echo 'CC=clang-23' >> "$GITHUB_ENV"
        echo 'CXX=clang++-23' >> "$GITHUB_ENV"
    - name: Install LLVM on macOS
      if: runner.os == 'macOS'
      shell: bash
      run: |
        set -euo pipefail
        brew install llvm
        echo "CC=$(brew --prefix llvm)/bin/clang" >> "$GITHUB_ENV"
        echo "CXX=$(brew --prefix llvm)/bin/clang++" >> "$GITHUB_ENV"
    - name: Install LLVM on Windows
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $installer = Join-Path $env:RUNNER_TEMP 'LLVM-23.1.5-win64.msi'
        Invoke-WebRequest 'https://github.com/llvm/llvm-project/releases/download/llvmorg-23.1.5/LLVM-23.1.5-win64.msi' -OutFile $installer
        $install = Start-Process msiexec.exe -ArgumentList @('/i', ('"' + $installer + '"'), '/qn', '/norestart') -Wait -PassThru -WindowStyle Hidden
        if ($install.ExitCode -notin @(0, 3010)) { throw "LLVM installation failed: $($install.ExitCode)" }
        'C:/Program Files/LLVM/bin' | Out-File -FilePath $env:GITHUB_PATH -Append
        'CC=clang' | Out-File -FilePath $env:GITHUB_ENV -Append
        'CXX=clang++' | Out-File -FilePath $env:GITHUB_ENV -Append
    - name: Verify toolchain
      shell: bash
      run: |
        set -euo pipefail
        cmake --version
        ninja --version
        "$CXX" --version
        python -c 'import os,re,subprocess; v=subprocess.check_output([os.environ["CXX"],"--version"],text=True); m=re.search(r"clang version (\d+)",v); assert m and int(m[1]) >= 23, "Clang 23 or newer is required"'