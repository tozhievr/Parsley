name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu 24.04 · Clang 23 · Ninja · CMake 4.5
            os: ubuntu-24.04
            triplet: linux-x86_64
            cxx_compiler: clang++-23
            c_compiler: clang-23
          - name: Windows 2025 · Clang 23 · Ninja · CMake 4.5
            os: windows-2025
            triplet: windows-x86_64
            cxx_compiler: clang++
            c_compiler: clang
          - name: macOS 14 · Clang 23 · Ninja · CMake 4.5
            os: macos-14
            triplet: macos-arm64
            cxx_compiler: clang++
            c_compiler: clang

          - name: Ubuntu 24.04 · Debug ASan/UBSan
            os: ubuntu-24.04
            triplet: linux-x86_64-asan
            build_type: Debug
            sanitizers: 'ON'

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python for build tools
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json

      - name: Build and test extension
        shell: bash
        run: |
          npm ci --prefix editors/vscode
          npm run check --prefix editors/vscode
          npm run compile --prefix editors/vscode
          npm test --prefix editors/vscode
          git diff --exit-code -- editors/vscode/out/extension.js
          npm run package --prefix editors/vscode

      - name: Install verified toolchain
        uses: ./.github/actions/toolchain
      - name: Configure CMake (CMake 4.5.0-rc1 + Ninja)
        shell: bash
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type || 'Release' }} \
            -DCMAKE_CXX_COMPILER="${CXX:-clang++}" \
            -DCMAKE_C_COMPILER="${CC:-clang}" \
            -DPARSLEY_BUILD_TESTS=ON -DPARSLEY_SANITIZERS=${{ matrix.sanitizers || 'OFF' }}

      - name: Build Parsley
        shell: bash
        run: |
          cmake --build build --config Release --parallel

      - name: Run Test Suite (CTest)
        env:
          PARSLEY_SANITIZE_GENERATED: ${{ matrix.sanitizers == 'ON' && '1' || '0' }}
        shell: bash
        run: |
          ctest --test-dir build --output-on-failure -C Release

      - name: Generated C17 with GCC
        if: runner.os == 'Linux' && matrix.sanitizers != 'ON'
        shell: bash
        run: python tests/audit_regression.py --cli build/parsley --cc gcc

      - name: Package with CPack
        if: matrix.sanitizers != 'ON'
        shell: bash
        run: |
          cpack --config build/CPackConfig.cmake -B build/package

      - name: Upload Build Artifacts
        if: matrix.sanitizers != 'ON'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: parsley-ci-package-${{ matrix.triplet }}
          path: build/package/*
          if-no-files-found: warn
