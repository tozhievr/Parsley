name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu 24.04 · Clang 23 · Ninja · CMake 4.5
            os: ubuntu-latest
            triplet: linux-x86_64
            cxx_compiler: clang++-23
            c_compiler: clang-23
          - name: Windows 2025 · Clang 23 · Ninja · CMake 4.5
            os: windows-latest
            triplet: windows-x86_64
            cxx_compiler: clang++
            c_compiler: clang
          - name: macOS 14 · Clang 23 · Ninja · CMake 4.5
            os: macos-latest
            triplet: macos-arm64
            cxx_compiler: clang++
            c_compiler: clang

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python for build tools
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Ninja
        run: |
          python -m pip install --upgrade pip
          python -m pip install ninja

      - name: Install CMake 4.5.0-rc1 (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          curl -sSL -o cmake.tar.gz https://github.com/Kitware/CMake/releases/download/v4.5.0-rc1/cmake-4.5.0-rc1-linux-x86_64.tar.gz || true
          if [ -s cmake.tar.gz ] && tar -tf cmake.tar.gz >/dev/null 2>&1; then
            tar -xzf cmake.tar.gz
            echo "$PWD/cmake-4.5.0-rc1-linux-x86_64/bin" >> $GITHUB_PATH
          else
            python -m pip install --pre "cmake>=4.5.0rc1" || true
          fi

      - name: Install CMake 4.5.0-rc1 (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          curl -sSL -o cmake.tar.gz https://github.com/Kitware/CMake/releases/download/v4.5.0-rc1/cmake-4.5.0-rc1-macos-universal.tar.gz || true
          if [ -s cmake.tar.gz ] && tar -tf cmake.tar.gz >/dev/null 2>&1; then
            tar -xzf cmake.tar.gz
            if [ -d "$PWD/cmake-4.5.0-rc1-macos-universal/CMake.app/Contents/bin" ]; then
              echo "$PWD/cmake-4.5.0-rc1-macos-universal/CMake.app/Contents/bin" >> $GITHUB_PATH
            elif [ -d "$PWD/cmake-4.5.0-rc1-macos-universal/bin" ]; then
              echo "$PWD/cmake-4.5.0-rc1-macos-universal/bin" >> $GITHUB_PATH
            fi
          else
            python -m pip install --pre "cmake>=4.5.0rc1" || true
          fi

      - name: Install CMake 4.5.0-rc1 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          try {
            $dest = "$env:RUNNER_TEMP/cmake45"
            New-Item -ItemType Directory -Force -Path $dest | Out-Null
            Invoke-WebRequest -Uri "https://github.com/Kitware/CMake/releases/download/v4.5.0-rc1/cmake-4.5.0-rc1-windows-x86_64.zip" -OutFile "$dest/cmake.zip"
            Expand-Archive -Path "$dest/cmake.zip" -DestinationPath $dest
            "$dest/cmake-4.5.0-rc1-windows-x86_64/bin" | Out-File -FilePath $env:GITHUB_PATH -Append
          } catch {
            python -m pip install --pre "cmake>=4.5.0rc1"
          }

      - name: Install LLVM / Clang 23 (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y wget lsb-release software-properties-common gnupg
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 23 all || sudo apt-get install -y clang ninja-build || true
          if command -v clang++-23 >/dev/null 2>&1; then
            echo "CC=clang-23" >> $GITHUB_ENV
            echo "CXX=clang++-23" >> $GITHUB_ENV
          else
            echo "CC=clang" >> $GITHUB_ENV
            echo "CXX=clang++" >> $GITHUB_ENV
          fi

      - name: Install Clang / LLVM (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install llvm ninja || true
          echo "PATH=/opt/homebrew/opt/llvm/bin:$PATH" >> $GITHUB_ENV
          echo "CC=$(brew --prefix llvm)/bin/clang" >> $GITHUB_ENV
          echo "CXX=$(brew --prefix llvm)/bin/clang++" >> $GITHUB_ENV

      - name: Set up Clang environment (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (Test-Path "D:/clang-23.1.3/bin/clang++.exe") {
            echo "CC=D:/clang-23.1.3/bin/clang.exe" | Out-File -FilePath $env:GITHUB_ENV -Append
            echo "CXX=D:/clang-23.1.3/bin/clang++.exe" | Out-File -FilePath $env:GITHUB_ENV -Append
          } else {
            echo "CC=clang" | Out-File -FilePath $env:GITHUB_ENV -Append
            echo "CXX=clang++" | Out-File -FilePath $env:GITHUB_ENV -Append
          }

      - name: Display tools and compiler versions
        shell: bash
        run: |
          cmake --version
          ninja --version
          ${CXX:-clang++} --version || true

      - name: Configure CMake (CMake 4.5.0-rc1 + Ninja)
        shell: bash
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER="${CXX:-clang++}" \
            -DCMAKE_C_COMPILER="${CC:-clang}" \
            -DPARSLEY_BUILD_TESTS=ON

      - name: Build Parsley
        shell: bash
        run: |
          cmake --build build --config Release --parallel

      - name: Run Test Suite (CTest)
        shell: bash
        run: |
          ctest --test-dir build --output-on-failure -C Release

      - name: Package with CPack
        shell: bash
        run: |
          cpack --config build/CPackConfig.cmake -B build/package

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: parsley-ci-package-${{ matrix.triplet }}
          path: build/package/*
          if-no-files-found: warn
