name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.1.0). If empty, uses GitHub ref.'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  verify-version:
    name: Verify SemVer Tag Consistency
    runs-on: ubuntu-latest
    outputs:
      release_version: ${{ steps.check.outputs.version }}
      release_tag: ${{ steps.check.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Compare Tag with VERSION File
        id: check
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        shell: bash
        run: |
          RAW_TAG="$RELEASE_TAG"
          TAG="${RAW_TAG#v}"
          
          if [ ! -f VERSION ]; then
            echo "::error::VERSION file does not exist!"
            exit 1
          fi
          
          FILE_VERSION=$(tr -d ' \r\n' < VERSION)
          echo "Tag version from git: ${TAG}"
          echo "Version in VERSION file: ${FILE_VERSION}"
          
          if [ "${TAG}" != "${FILE_VERSION}" ]; then
            echo "::error::Tag '${RAW_TAG}' does not match content of VERSION file '${FILE_VERSION}'!"
            exit 1
          fi
          
          echo "version=${FILE_VERSION}" >> $GITHUB_OUTPUT
          echo "tag=v${FILE_VERSION}" >> $GITHUB_OUTPUT
          echo "✓ SemVer verification succeeded: v${FILE_VERSION}"

  build-and-package:
    name: Build & Package (${{ matrix.name }})
    needs: verify-version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-24.04
            triplet: linux-x86_64
            cxx_compiler: clang++-23
            c_compiler: clang-23
          - name: Windows x86_64
            os: windows-2025
            triplet: windows-x86_64
            cxx_compiler: clang++
            c_compiler: clang
          - name: macOS ARM64
            os: macos-latest
            triplet: macos-arm64
            cxx_compiler: clang++
            c_compiler: clang

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python for build tools
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json

      - name: Build and test extension
        shell: bash
        run: |
          npm ci --prefix editors/vscode
          npm run check --prefix editors/vscode
          npm run compile --prefix editors/vscode
          npm test --prefix editors/vscode
          git diff --exit-code -- editors/vscode/out/extension.js
          npm run package --prefix editors/vscode

      - name: Install verified toolchain
        uses: ./.github/actions/toolchain
      - name: Configure CMake (CMake 4.5.0-rc1 + Ninja)
        shell: bash
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER="${CXX:-clang++}" \
            -DCMAKE_C_COMPILER="${CC:-clang}" \
            -DPARSLEY_BUILD_TESTS=ON

      - name: Build Parsley
        shell: bash
        run: |
          cmake --build build --config Release --parallel

      - name: Run Test Suite (CTest)
        shell: bash
        run: |
          ctest --test-dir build --output-on-failure -C Release

      - name: Package with CPack (ZIP and TGZ)
        shell: bash
        run: |
          mkdir -p dist
          cpack --config build/CPackConfig.cmake -B dist -G "ZIP;TGZ"

      - name: Include installable extension
        if: runner.os == 'Linux'
        shell: bash
        run: cp editors/vscode/parsley-lang-[0-9]*.vsix dist/

      - name: Generate checksums
        run: python scripts/package_checksums.py dist
      - name: Upload Platform Package Artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: parsley-${{ matrix.triplet }}-${{ needs.verify-version.outputs.release_tag }}
          path: dist/*
          if-no-files-found: error

  publish-release:
    permissions:
      contents: write
    name: Publish GitHub Release
    needs: [verify-version, build-and-package]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download all package artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: release-assets/

      - name: Consolidate assets and compute unified SHA256SUMS
        shell: bash
        run: |
          mkdir -p release-final
          find release-assets/ -type f \( -name "*.zip" -o -name "*.tar.gz" -o -name "*.tgz" -o -name "*.vsix" \) -exec cp {} release-final/ \;
          cd release-final
          python ../scripts/package_checksums.py .
          ls -la

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ needs.verify-version.outputs.release_tag }}
          name: "Parsley ${{ needs.verify-version.outputs.release_tag }}"
          body: |
            ## Parsley Release ${{ needs.verify-version.outputs.release_tag }}

            ### Highlights
            - Haskell-style DSL for grammar definitions and parser generation.
            - Exclusive parser generation backend: **ISO C23** emitting public interface `parser.h`, implementation `parser.c`, and cross-platform dynamic libraries (`.dll`/`.so`/`.dylib`).
            - Static grammar analysis (FIRST/FOLLOW, ambiguity detection, automated left-factoring, precedence climbing).
            - Built with C++26 modules, CMake 4.5, and Clang 23.

            ### Verification
            All packages include SHA256 checksums in `SHA256SUMS.txt`.
          draft: false
          prerelease: false
          files: |
            release-final/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
