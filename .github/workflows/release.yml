name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.1.0). If empty, uses GitHub ref.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  verify-version:
    name: Verify SemVer Tag Consistency
    runs-on: ubuntu-latest
    outputs:
      release_version: ${{ steps.check.outputs.version }}
      release_tag: ${{ steps.check.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compare Tag with VERSION File
        id: check
        shell: bash
        run: |
          RAW_TAG="${{ github.event.inputs.tag || github.ref_name }}"
          TAG="${RAW_TAG#v}"
          
          if [ ! -f VERSION ]; then
            echo "::error::VERSION file does not exist!"
            exit 1
          fi
          
          FILE_VERSION=$(tr -d ' \r\n' < VERSION)
          echo "Tag version from git: ${TAG}"
          echo "Version in VERSION file: ${FILE_VERSION}"
          
          if [ "${TAG}" != "${FILE_VERSION}" ]; then
            echo "::error::Tag '${RAW_TAG}' does not match content of VERSION file '${FILE_VERSION}'!"
            exit 1
          fi
          
          echo "version=${FILE_VERSION}" >> $GITHUB_OUTPUT
          echo "tag=v${FILE_VERSION}" >> $GITHUB_OUTPUT
          echo "✓ SemVer verification succeeded: v${FILE_VERSION}"

  build-and-package:
    name: Build & Package (${{ matrix.name }})
    needs: verify-version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-latest
            triplet: linux-x86_64
            cxx_compiler: clang++-23
            c_compiler: clang-23
          - name: Windows x86_64
            os: windows-latest
            triplet: windows-x86_64
            cxx_compiler: clang++
            c_compiler: clang
          - name: macOS ARM64
            os: macos-latest
            triplet: macos-arm64
            cxx_compiler: clang++
            c_compiler: clang

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python for build tools
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Ninja
        run: |
          python -m pip install --upgrade pip
          python -m pip install ninja

      - name: Install CMake 4.5.0-rc1 (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          curl -sSL -o cmake.tar.gz https://github.com/Kitware/CMake/releases/download/v4.5.0-rc1/cmake-4.5.0-rc1-linux-x86_64.tar.gz || true
          if [ -s cmake.tar.gz ] && tar -tf cmake.tar.gz >/dev/null 2>&1; then
            tar -xzf cmake.tar.gz
            echo "$PWD/cmake-4.5.0-rc1-linux-x86_64/bin" >> $GITHUB_PATH
          else
            python -m pip install --pre "cmake>=4.5.0rc1" || true
          fi

      - name: Install CMake 4.5.0-rc1 (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          curl -sSL -o cmake.tar.gz https://github.com/Kitware/CMake/releases/download/v4.5.0-rc1/cmake-4.5.0-rc1-macos-universal.tar.gz || true
          if [ -s cmake.tar.gz ] && tar -tf cmake.tar.gz >/dev/null 2>&1; then
            tar -xzf cmake.tar.gz
            if [ -d "$PWD/cmake-4.5.0-rc1-macos-universal/CMake.app/Contents/bin" ]; then
              echo "$PWD/cmake-4.5.0-rc1-macos-universal/CMake.app/Contents/bin" >> $GITHUB_PATH
            elif [ -d "$PWD/cmake-4.5.0-rc1-macos-universal/bin" ]; then
              echo "$PWD/cmake-4.5.0-rc1-macos-universal/bin" >> $GITHUB_PATH
            fi
          else
            python -m pip install --pre "cmake>=4.5.0rc1" || true
          fi

      - name: Install CMake 4.5.0-rc1 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          try {
            $dest = "$env:RUNNER_TEMP/cmake45"
            New-Item -ItemType Directory -Force -Path $dest | Out-Null
            Invoke-WebRequest -Uri "https://github.com/Kitware/CMake/releases/download/v4.5.0-rc1/cmake-4.5.0-rc1-windows-x86_64.zip" -OutFile "$dest/cmake.zip"
            Expand-Archive -Path "$dest/cmake.zip" -DestinationPath $dest
            "$dest/cmake-4.5.0-rc1-windows-x86_64/bin" | Out-File -FilePath $env:GITHUB_PATH -Append
          } catch {
            python -m pip install --pre "cmake>=4.5.0rc1"
          }

      - name: Install LLVM / Clang 23 (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y wget lsb-release software-properties-common gnupg
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 23 all || sudo apt-get install -y clang ninja-build || true
          if command -v clang++-23 >/dev/null 2>&1; then
            echo "CC=clang-23" >> $GITHUB_ENV
            echo "CXX=clang++-23" >> $GITHUB_ENV
          else
            echo "CC=clang" >> $GITHUB_ENV
            echo "CXX=clang++" >> $GITHUB_ENV
          fi

      - name: Install Clang / LLVM (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install llvm ninja || true
          echo "PATH=/opt/homebrew/opt/llvm/bin:$PATH" >> $GITHUB_ENV
          echo "CC=$(brew --prefix llvm)/bin/clang" >> $GITHUB_ENV
          echo "CXX=$(brew --prefix llvm)/bin/clang++" >> $GITHUB_ENV

      - name: Set up Clang environment (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (Test-Path "D:/clang-23.1.3/bin/clang++.exe") {
            echo "CC=D:/clang-23.1.3/bin/clang.exe" | Out-File -FilePath $env:GITHUB_ENV -Append
            echo "CXX=D:/clang-23.1.3/bin/clang++.exe" | Out-File -FilePath $env:GITHUB_ENV -Append
          } else {
            echo "CC=clang" | Out-File -FilePath $env:GITHUB_ENV -Append
            echo "CXX=clang++" | Out-File -FilePath $env:GITHUB_ENV -Append
          }

      - name: Display tools and compiler versions
        shell: bash
        run: |
          cmake --version
          ninja --version
          ${CXX:-clang++} --version || true

      - name: Configure CMake (CMake 4.5.0-rc1 + Ninja)
        shell: bash
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER="${CXX:-clang++}" \
            -DCMAKE_C_COMPILER="${CC:-clang}" \
            -DPARSLEY_BUILD_TESTS=ON

      - name: Build Parsley
        shell: bash
        run: |
          cmake --build build --config Release --parallel

      - name: Run Test Suite (CTest)
        shell: bash
        run: |
          ctest --test-dir build --output-on-failure -C Release

      - name: Package with CPack (ZIP and TGZ)
        shell: bash
        run: |
          mkdir -p dist
          cpack --config build/CPackConfig.cmake -B dist -G "ZIP;TGZ"

      - name: Generate Checksums (Linux / macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cd dist
          for f in *; do
            if [ -f "$f" ]; then
              sha256sum "$f" > "$f.sha256"
            fi
          done

      - name: Generate Checksums (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cd dist
          Get-ChildItem -File | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Out-File -FilePath "$($_.FullName).sha256" -Encoding ascii
          }

      - name: Upload Platform Package Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: parsley-${{ matrix.triplet }}-${{ needs.verify-version.outputs.release_tag }}
          path: dist/*
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs: [verify-version, build-and-package]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all package artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets/

      - name: Consolidate assets and compute unified SHA256SUMS
        shell: bash
        run: |
          mkdir -p release-final
          find release-assets/ -type f \( -name "*.zip" -o -name "*.tar.gz" -o -name "*.tgz" \) -exec cp {} release-final/ \;
          cd release-final
          sha256sum * > SHA256SUMS.txt
          ls -la

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.verify-version.outputs.release_tag }}
          name: "Parsley ${{ needs.verify-version.outputs.release_tag }}"
          body: |
            ## Parsley Release ${{ needs.verify-version.outputs.release_tag }}

            ### Highlights
            - Haskell-style DSL for grammar definitions and parser generation.
            - Exclusive parser generation backend: **ISO C17** emitting public interface `parser.h`, implementation `parser.c`, and cross-platform dynamic libraries (`.dll`/`.so`/`.dylib`).
            - Static grammar analysis (FIRST/FOLLOW, ambiguity detection, automated left-factoring, precedence climbing).
            - Built with C++26 modules, CMake 4.5, and Clang 23.

            ### Verification
            All packages include SHA256 checksums in `SHA256SUMS.txt`.
          draft: false
          prerelease: false
          files: |
            release-final/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
